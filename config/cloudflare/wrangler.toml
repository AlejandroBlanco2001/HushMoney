name = "hushmoney-email"
main = "worker.js"
compatibility_date = "2026-10-18"

[vars]
# Replace with the Forwarder email endpoint before deploy.
EMAIL_WEBHOOK_URL = "https://REPLACE_ME/channels/email"

# EMAIL_WEBHOOK_SECRET is a Cloudflare secret, not a var:
#   npx wrangler secret put EMAIL_WEBHOOK_SECRET
# For local testing (`wrangler dev`), put it in .env or .dev.vars next to this
# file instead — never here, since [vars] are committed and deployed in plaintext.
