# HushMoney — OpenShell sandbox profile
#
# Bundles the container image, policy, inference routing, and mounts into a
# reusable template. Register once; create sandboxes from it as needed.
#
# Register:
#   openshell profile register config/openshell/profile.yaml
#
# Create sandbox:
#   openshell sandbox create --from hushmoney --name hushmoney-1
#
# The NEBIUS_API_KEY never enters the container — OpenShell manages it.
# Register the provider once:
#   openshell provider create nebius \
#     --endpoint https://api.studio.nebius.ai/v1/ \
#     --api-key $NEBIUS_API_KEY
#
# Reference: https://docs.nvidia.com/openshell/latest/sandboxes/manage-sandboxes.html

name: hushmoney
description: "HushMoney — Hermes Agent sandboxed inside NVIDIA OpenShell"

container:
  image: hushmoney-hermes
  command: ["/app/docker-entrypoint.sh"]

policy: config/openshell/policy.yaml

resources:
  cpu: "1"
  memory: "512Mi"

# OpenShell intercepts calls to https://inference.local inside the sandbox and
# routes them to Nebius. The agent only ever sees inference.local — no API key
# needed in the container environment.
inference:
  provider: nebius
  model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B

mounts:
  - hostPath: "hermes-data"
    containerPath: "/opt/data"
  - hostPath: "./skills"
    containerPath: "/opt/data/skills"
    readOnly: true
  - hostPath: "./config/hermes.yaml"
    containerPath: "/opt/data/hermes.yaml"
    readOnly: true

env:
  # Tell Hermes to use the OpenShell inference router instead of Nebius directly.
  - name: OPENAI_BASE_URL
    value: "http://inference.local/v1"
  - name: OPENAI_API_KEY
    value: "managed-by-openshell"
  - name: TELEGRAM_BOT_TOKEN
    valueFrom: { secret: TELEGRAM_BOT_TOKEN }
  - name: TELEGRAM_CHAT_ID
    valueFrom: { secret: TELEGRAM_CHAT_ID }
  - name: HERMES_GATEWAY_SECRET
    valueFrom: { secret: HERMES_GATEWAY_SECRET }
  # Who may DM the bot. setup.sh sets this secret to the chat ID (normal) or "*" (--demo).
  - name: TELEGRAM_ALLOWED_USERS
    valueFrom: { secret: TELEGRAM_ALLOWED_USERS }
