<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- chat background -->
  <rect x="0" y="0" width="820" height="520" rx="16" fill="#0e1621"/>
  <rect x="0.5" y="0.5" width="819" height="519" rx="16" fill="none" stroke="#223344"/>

  <!-- header -->
  <rect x="0" y="0" width="820" height="64" rx="16" fill="#17212b"/>
  <rect x="0" y="48" width="820" height="16" fill="#17212b"/>
  <rect x="24" y="16" width="34" height="34" rx="9" fill="#f0a84e"/>
  <text x="41" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#5c3b0e">$</text>
  <text x="72" y="30" font-size="16" font-weight="600" fill="#ffffff">HushMoney</text>
  <text x="72" y="49" font-size="12.5" fill="#6d8299">bot</text>

  <!-- msg 1: outgoing /start -->
  <rect x="648" y="84" width="148" height="40" rx="14" fill="#2b5278"/>
  <text x="672" y="109" font-size="15" fill="#e9eef3" font-family="ui-monospace, Menlo, monospace">/start</text>
  <text x="762" y="119" font-size="10.5" fill="#8aa6bf">10:24</text>

  <!-- msg 2: incoming welcome (wizard first question) -->
  <rect x="24" y="136" width="560" height="104" rx="14" fill="#182533"/>
  <text x="46" y="166" font-size="15" fill="#e9eef3">👋 Welcome to HushMoney! Let's get you set up.</text>
  <text x="46" y="192" font-size="15" fill="#e9eef3">First — which bank do you want to add?</text>
  <text x="46" y="220" font-size="15" fill="#8aa6bf">1) Bancolombia  2) Davivienda  3) Nequi  4) BBVA</text>
  <text x="560" y="232" font-size="10.5" fill="#6d8299">10:24</text>

  <!-- msg 3: outgoing /status -->
  <rect x="640" y="256" width="156" height="40" rx="14" fill="#2b5278"/>
  <text x="664" y="281" font-size="15" fill="#e9eef3" font-family="ui-monospace, Menlo, monospace">/status</text>
  <text x="762" y="291" font-size="10.5" fill="#8aa6bf">10:31</text>

  <!-- msg 4: incoming status reply -->
  <rect x="24" y="308" width="520" height="160" rx="14" fill="#182533"/>
  <text x="46" y="340" font-size="15" font-weight="600" fill="#6ee787">✅ HushMoney is running</text>
  <text x="46" y="370" font-size="15" fill="#e9eef3">Accounts:   3 linked</text>
  <text x="46" y="396" font-size="15" fill="#e9eef3">Forwarder:  polling INBOX</text>
  <text x="46" y="422" font-size="15" fill="#e9eef3">SMS intake: connected</text>
  <text x="46" y="448" font-size="15" fill="#8aa6bf">Last sync:  just now</text>
  <text x="520" y="460" font-size="10.5" fill="#6d8299">10:31</text>
</svg>
