#
# docker-compose.yml — HushMoney stack (local + EC2)
#
# Usage:
#   cp .env.example .env && $EDITOR .env  # fill in secrets
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Notes:
#   - hermes-data volume persists SQLite and learned patterns across restarts.
#   - forwarder-data volume persists the forwarder SQLite DB (forwarder.db).
#   - pattern-inbox volume is shared between forwarder and hermes for proposal files.
#     hermes writes proposals; forwarder validates and removes them.
#   - Skills and config are bind-mounted read-only so edits take effect on restart.
#   - sqlite-web-hermes (8082) and sqlite-web-forwarder (8083) expose the DBs on
#     localhost-only ports. Access via SSH tunnel:
#     ssh -L 8082:localhost:8082 -L 8083:localhost:8083 user@host
#

services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hushmoney-hermes
    container_name: hermes
    restart: unless-stopped
    volumes:
      - hermes-data:/opt/data
      - pattern-inbox:/opt/data/pattern-inbox
      - ./skills:/opt/data/skills:ro
      - ./config/hermes.yaml:/opt/data/hermes.yaml:ro
      - ./config/hermes.yaml:/app/hermes.yaml:ro
      - ./config/schema.sql:/app/config/schema.sql:ro
      - ./config/SOUL.md:/app/SOUL.md:ro
      - ./config/accounts.md:/app/accounts.md:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - OPENAI_API_KEY=${NEBIUS_API_KEY}
      - OPENAI_BASE_URL=https://api.studio.nebius.ai/v1/
      # Categorizer-only model override: lets categorization run on the local 'ollama'
      # service while the agent stays on OPENAI_BASE_URL above. Unset → falls back to the
      # agent endpoint/model. Enable local: `local-llm` profile + set these in .env
      # (e.g. CATEGORIZER_BASE_URL=http://ollama:11434/v1, CATEGORIZER_MODEL=gemma4:e4b).
      - CATEGORIZER_BASE_URL=${CATEGORIZER_BASE_URL-}
      - CATEGORIZER_MODEL=${CATEGORIZER_MODEL-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-${TELEGRAM_CHAT_ID}}
      - HERMES_GATEWAY_SECRET=${HERMES_GATEWAY_SECRET}
      - HUSHMONEY_DB=/opt/data/hushmoney.db
      - HUSHMONEY_INBOX=/opt/data/pattern-inbox
      - HUSHMONEY_REGISTRY=/opt/data/pattern-inbox/registry.json
      # LLM telemetry: the in-container proxy pushes per-call token/latency events
      # here. Set OPENOBSERVE_URL='' to make the proxy a no-op (telemetry disabled);
      # the proxy still runs and forwards, it just stops recording. No depends_on —
      # telemetry is best-effort and must never gate the app (the push is fail-open).
      - OPENOBSERVE_URL=${OPENOBSERVE_URL-http://openobserve:5080}
      - OPENOBSERVE_STREAM=llm_usage
      - OPENOBSERVE_AUTH=${OPENOBSERVE_AUTH}
    init: true
    ports:
      - "8081:8080"

  forwarder:
    build:
      context: ./forwarder
    restart: unless-stopped
    volumes:
      - ./config/hermes.yaml:/app/config/hermes.yaml:ro
      - forwarder-data:/app/data
      - pattern-inbox:/app/pattern-inbox
    environment:
      - HERMES_GATEWAY_URL=http://hermes:8080/gateway
      - HERMES_GATEWAY_SECRET=${HERMES_GATEWAY_SECRET}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USERNAME=${IMAP_USERNAME}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - IMAP_MAILBOX=${IMAP_MAILBOX:-INBOX}
      - BANK_SENDER_EMAILS=${BANK_SENDER_EMAILS}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-300}
      - FORWARDER_DB_PATH=/app/data/forwarder.db
      - FORWARDER_INBOX_DIR=/app/pattern-inbox
      - HERMES_WEBHOOK_URL=http://hermes:8080/telegram
    depends_on:
      - hermes

  sms-listener:
    image: python:3.12-slim
    restart: unless-stopped
    command: sh -c "pip install -q uv && uv run --python cpython-3.12 --with pyrogram --with python-dotenv --with httpx python /app/sms_listener.py"
    volumes:
      - ./forwarder/scripts/sms_listener.py:/app/sms_listener.py:ro
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_SESSION_STRING=${TELEGRAM_SESSION_STRING}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FORWARDER_WEBHOOK_URL=http://forwarder:9000/telegram
      - PYTHONUNBUFFERED=1
    depends_on:
      - forwarder

  # Read-only SQLite web UIs — localhost only, never exposed externally.
  # Access via SSH tunnel:
  #   ssh -L 8082:localhost:8082 -L 8083:localhost:8083 user@host
  # hermes (8082): transactions, accounts, debts
  # forwarder (8083): learned patterns
  sqlite-web-hermes:
    image: coleifer/sqlite-web
    restart: unless-stopped
    command: sqlite_web --host 0.0.0.0 --port 8080 --read-only /data/hushmoney.db
    volumes:
      - hermes-data:/data
    ports:
      - "127.0.0.1:8082:8080"

  sqlite-web-forwarder:
    image: coleifer/sqlite-web
    restart: unless-stopped
    command: sqlite_web --host 0.0.0.0 --port 8080 --read-only /data/forwarder.db
    volumes:
      - forwarder-data:/data
    ports:
      - "127.0.0.1:8083:8080"

  # LLM observability store + dashboards. Single-binary, local-disk (parquet) mode —
  # the hermes container's telemetry proxy pushes token/latency events here.
  # Localhost only; access via SSH tunnel like the sqlite-web UIs.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    # Only starts when the 'telemetry' profile is active (default in dev.sh;
    # skipped by `dev.sh --no-telemetry`).
    profiles: ["telemetry"]
    environment:
      - ZO_LOCAL_MODE=true
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=${OPENOBSERVE_ROOT_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_ROOT_PASSWORD}
    volumes:
      - openobserve-data:/data
    ports:
      - "127.0.0.1:5080:5080"

  # Local LLM server for the categorizer (opt-in). Starts only under the 'local-llm'
  # profile. After `up`, pull a model into the volume:
  #   podman compose exec ollama ollama pull gemma4:e4b
  # Then point the categorizer at it in .env (CATEGORIZER_BASE_URL / CATEGORIZER_MODEL).
  # Localhost port is also exposed so host-side evals (evals/model_selection) can reuse it.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  hermes-data:
    external: true
    name: untyped_hermes-data
  forwarder-data:
    external: true
    name: untyped_forwarder-data
  pattern-inbox:
    external: true
    name: untyped_pattern-inbox
  openobserve-data:
  ollama-models:
