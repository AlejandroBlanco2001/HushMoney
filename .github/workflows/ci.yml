name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & format (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "forwarder/uv.lock"

      - name: Install dependencies
        run: uv sync --project forwarder --frozen

      # Use the ruff version pinned in forwarder/uv.lock (not uvx-latest) so CI
      # matches local `uv run` and never drifts on a new ruff release. The
      # forwarder/ package uses its own config; the rest uses the root ruff.toml.
      - name: Ruff check
        run: uv run --project forwarder ruff check .

      - name: Ruff format check
        run: uv run --project forwarder ruff format --check .

  typecheck:
    name: Type check (Pyright, strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "forwarder/uv.lock"

      - name: Install dependencies
        run: uv sync --project forwarder --frozen

      # forwarder/ uses its own [tool.pyright] (src); the repo root uses
      # pyrightconfig.json (gateway_server.py), both sharing forwarder's venv.
      - name: Pyright (forwarder/src)
        run: cd forwarder && uv run pyright

      - name: Pyright (gateway_server.py)
        run: uv run --project forwarder pyright

  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "forwarder/uv.lock"

      - name: Install dependencies
        run: uv sync --project forwarder --frozen

      - name: Run tests
        run: uv run --project forwarder pytest -c forwarder/pyproject.toml forwarder/tests

  evals:
    name: Offline skill evals (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deterministic, no-API-key evals only. The LLM evals (run.py, judge.py)
      # need NEBIUS_API_KEY and run in the manual Evals workflow instead.
      - name: Run offline evals
        run: |
          set -euo pipefail
          find evals -mindepth 2 -maxdepth 2 -name "*.py" \
            ! -path "*/lib/*" \
            ! -path "*/model_selection/*" \
            ! -name "run.py" \
            ! -name "judge.py" \
            | sort | while read -r script; do
              echo "::group::$script"
              python "$script" || exit 1
              echo "::endgroup::"
            done
