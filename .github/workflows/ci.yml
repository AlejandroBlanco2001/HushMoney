name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "forwarder/uv.lock"

      - name: Install dependencies
        run: uv sync --project forwarder --frozen

      - name: Run tests
        run: uv run --project forwarder pytest -c forwarder/pyproject.toml forwarder/tests
