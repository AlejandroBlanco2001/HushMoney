name: Evals

on:
  workflow_dispatch:

jobs:
  evals:
    name: Run all skill evals
    runs-on: ubuntu-latest
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run evals
        run: |
          find evals -mindepth 2 -maxdepth 2 -name "*.py" \
            ! -path "*/lib/*" \
            ! -path "*/model_selection/*" \
            | sort | while read script; do
              echo "::group::$script"
              if [[ "$script" == */run.py ]]; then
                python "$script" --model super
              else
                python "$script"
              fi
              echo "::endgroup::"
            done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/**/results.json
